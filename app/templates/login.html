{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="mb-4 text-center">
            <h1 class="brand-text text-primary-brown display-4 mb-2">DormDrop</h1>
            <p class="text-muted">Welcome back to the campus market.</p>
        </div>

        <div class="card p-4">
            <form method="POST" action="">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" required>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label">Password</label>
                        <a href="{{ url_for('main.forgot_password') }}" class="small text-decoration-none text-primary-brown">Forgot?</a>
                    </div>
                    <input type="password" class="form-control" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary mb-3">Log In</button>
            </form>
        </div>

        <div class="text-center mt-4">
            <span class="text-muted">New here?</span>
            <a href="{{ url_for('main.register') }}" class="text-decoration-none fw-semibold text-primary-brown ms-1">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
