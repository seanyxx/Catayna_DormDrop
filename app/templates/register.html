{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="mb-4">
            <h2>Create Account</h2>
            <p class="text-muted">Join the campus marketplace.</p>
        </div>

        <form method="POST" action="">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="full_name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">University Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>

            <hr class="my-4" style="border-color: var(--border-soft);">
            <h5 class="mb-3">Security Check</h5>
            <p class="small text-muted mb-3">If you forget your password, you will be asked this question.</p>

            <div class="mb-3">
                <label class="form-label">Select a Question</label>
                <select class="form-select" name="security_question" required>
                    <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                    <option value="What city were you born in?">What city were you born in?</option>
                    <option value="What is your favorite childhood book?">What is your favorite childhood book?</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Your Answer</label>
                <input type="text" class="form-control" name="security_answer" required>
            </div>

            <button type="submit" class="btn btn-primary mb-3">Register</button>
            <div class="text-center">
                <a href="{{ url_for('main.login') }}" class="text-decoration-none fw-semibold text-primary-brown">Already have an account? Log in</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
