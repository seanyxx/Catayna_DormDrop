{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-12 col-md-6 col-lg-4">

        <div class="mb-4">
            <a href="{{ url_for('main.login') }}" class="text-decoration-none text-primary-brown fw-semibold">&larr; Back to Login</a>
        </div>

        <div class="mb-4 text-center">
            <h2>Reset Password</h2>
            <p class="text-muted">Recover your DormDrop account.</p>
        </div>

        <div class="card p-4">
            {% if step == 1 %}
            <form method="POST" action="">
                <div class="mb-4">
                    <label class="form-label">University Email</label>
                    <input type="email" class="form-control" name="email" required placeholder="Enter your registered email">
                </div>
                <button type="submit" class="btn btn-primary">Find Account</button>
            </form>

            {% elif step == 2 %}
            <form method="POST" action="">
                <input type="hidden" name="email" value="{{ user.email }}">

                <div class="mb-4 p-3 rounded-3" style="background-color: var(--bg-cream); border: 1px solid var(--border-soft);">
                    <label class="form-label text-muted small mb-1">Your Security Question</label>
                    <p class="fw-bold mb-0" style="color: var(--text-dark);">{{ user.security_question }}</p>
                </div>

                <div class="mb-4">
                    <label class="form-label">Answer</label>
                    <input type="text" class="form-control" name="security_answer" required autocomplete="off">
                </div>

                <hr class="my-4" style="border-color: var(--border-soft);">

                <div class="mb-4">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" name="new_password" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary">Save New Password</button>
            </form>
            {% endif %}
        </div>

    </div>
</div>
{% endblock %}
